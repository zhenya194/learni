{% extends 'main/base.html' %}
{% load static %}

{% block title %}Login{% endblock %}

{% block styles %}
<link rel="stylesheet" href="{% static 'profile/login.css' %}">
{% endblock %}

{% block content %}

<main>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-warning">Login</button>
    </form>

    {% if form.errors %}
        <p id="auth-error">Invalid username or password.</p>
    {% endif %}
</main>

{% endblock %}
