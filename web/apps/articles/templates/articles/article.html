{% extends 'main/base.html' %}
{% load static %}

{% block title %}{{ lesson.title }}{% endblock %}

{% block styles %}
<link rel="stylesheet" href="{% static 'articles/article.css' %}">
{% endblock %}

{% block content %}

<main class="article">
    <h2>{{ article.title }}</h2>
    <p>{{ article.date }}</p>
    <p>{{ article.description }}</p>
    {% if article.image %}
        <img src="{{ article.image.url }}" alt="Article image" class="article-image">
    {% endif %}
    <br><br>
    <p>{{ article.text }}</p>
</main>

{% endblock %}
