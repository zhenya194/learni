{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Website for learning.">
    <title>{% block title %}{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" href="{% static 'main/base.css' %}">
    {% block styles %}
    {% endblock %}
</head>
<body>

    <header>
        <div class="main-menu1">
            <a href="{% url 'index' %}" id="logo"><img src="{% static 'main/logo.png' %}" alt="logo" id="logo"></a>
            <a href="{% url 'lessons' %}" class="btn btn-warning flex-header" id="lessonsButton">
                <i class="fa-solid fa-book"></i> Lessons
            </a>
            <a href="{% url 'articles' %}" class="btn btn-success flex-header">
                <i class="fa-solid fa-newspaper"></i> Articles
            </a>
            <a href="{% url 'solutions' %}" class="btn btn-light">
                <i class="fa-solid fa-diagram-project"></i> Let's do it anyway!
            </a>
        </div>
        <a href="{% url 'profile' %}" class="btn btn-info flex-header" id="acBtn">
            <i class="fa-solid fa-circle-user"></i> Account
        </a>
    </header>

    <div id="main-div">
        {% block content %}
        {% endblock %}
    </div>
    
    <footer>
        <p>Learni</p>
        <a href="{% url 'privacy' %}">Privacy policy</a>
        <br>
        <a href="https://github.com/zhenya194/learni" target="_blank"><i class="fa-brands fa-github"></i> Github</a>
    </footer>

</body>
</html>
